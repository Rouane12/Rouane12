name: Profile metrics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the profile metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rouane12
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: refresh profile metrics"
          template: classic
          config_timezone: Etc/UTC
          config_display: large
          config_octicon: "yes"
          config_twemoji: "yes"
          config_padding: 8, 12
          base: header, activity, community, repositories, metadata
          plugin_activity: "yes"
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year
          plugin_languages: "yes"
          plugin_languages_sections: recently-used
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css
          extras_css: |
            :root {
              --color-accent-fg: #7c3aed;
              --color-done-fg: #0d9488;
              --color-calendar-graph-day-L4-bg: #7c3aed;
              --color-calendar-graph-day-L3-bg: #8b5cf6;
              --color-calendar-graph-day-L2-bg: #0891b2;
              --color-calendar-graph-day-L1-bg: #0d9488;
            }
